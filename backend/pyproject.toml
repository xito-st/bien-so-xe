[project]
name = "biensoxe"
version = "0.1.0"
description = "Phần mềm quản lý đặt và cấp phát biển số xe (34 tỉnh/thành)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
    "xlsxwriter>=3.2.0",
]

[project.scripts]
biensoxe = "biensoxe.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "freezegun>=1.5.1",
    "httpx>=0.28.0",
    "hypothesis>=6.122.0",
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biensoxe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
